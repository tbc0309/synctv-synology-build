name: Synology server binaries

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Upstream branch, tag, or commit
        required: false
        default: main
        type: string
  schedule:
    - cron: "20 18 * * *"

permissions:
  contents: read

concurrency:
  group: synology-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: DSM 7.1 ${{ matrix.synology_arch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - synology_arch: amd64
            rust_target: x86_64-unknown-linux-gnu
            platform: avoton
            toolchain_file: avoton-gcc850_glibc226_x86_64-GPL.txz
            toolchain_md5: 93e6ae9501327554c51a1e045e1b69a1
            archive_path: Intel%20x86%20Linux%203.10.108%20%28Avoton%29
          - synology_arch: armv8
            rust_target: aarch64-unknown-linux-gnu
            platform: rtd1296
            toolchain_file: rtd1296-gcc850_glibc226_armv8-GPL.txz
            toolchain_md5: 370aec3c42dd6d9336b82c6a46e7f105
            archive_path: Realtek%20RTD129x%20Linux%204.4.180
    env:
      DSM_TOOLCHAIN_VERSION: 7.1-42661
      SQLX_OFFLINE: "true"
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          repository: synctv-org/synctv
          ref: ${{ github.event.inputs.ref || 'main' }}

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake curl libclang-dev nasm perl protobuf-compiler xz-utils

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@v2
        with:
          key: synology-${{ matrix.synology_arch }}

      - name: Download Synology DSM toolchain
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/${{ matrix.toolchain_file }}"
          url="https://global.synologydownload.com/download/ToolChain/toolchain/${DSM_TOOLCHAIN_VERSION}/${{ matrix.archive_path }}/${{ matrix.toolchain_file }}"
          curl --fail --location --retry 3 --output "${archive}" "${url}"
          echo "${{ matrix.toolchain_md5 }}  ${archive}" | md5sum --check --strict
          mkdir -p "${RUNNER_TEMP}/synology-toolchain"
          tar -xJf "${archive}" -C "${RUNNER_TEMP}/synology-toolchain"

      - name: Configure Synology cross compiler
        id: compiler
        shell: bash
        run: |
          set -euo pipefail
          toolchain_root="${RUNNER_TEMP}/synology-toolchain"
          linker="$(find "${toolchain_root}" \( -type f -o -type l \) -path '*/bin/*-gcc' -print -quit)"
          if [[ -z "${linker}" ]]; then
            echo "Synology GCC was not found in the extracted toolchain" >&2
            exit 1
          fi
          compiler_prefix="${linker%-gcc}"
          rust_env_suffix="$(tr '[:lower:]-' '[:upper:]_' <<< '${{ matrix.rust_target }}')"
          cc_env_suffix="$(tr '-' '_' <<< '${{ matrix.rust_target }}')"
          {
            echo "CARGO_TARGET_${rust_env_suffix}_LINKER=${linker}"
            echo "CC_${cc_env_suffix}=${linker}"
            echo "AR_${cc_env_suffix}=${compiler_prefix}-ar"
            echo "RANLIB_${cc_env_suffix}=${compiler_prefix}-ranlib"
          } >> "${GITHUB_ENV}"
          "${linker}" --version
          echo "linker=${linker}" >> "${GITHUB_OUTPUT}"

      - name: Build SyncTV server
        run: |
          cargo +nightly build \
            --locked \
            --release \
            --target "${{ matrix.rust_target }}" \
            --package synctv \
            --bin synctv \
            --no-default-features \
            --features "tls-ring,tls-webpki-roots"

      - name: Verify and package binary
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.rust_target }}/release/synctv"
          file "${binary}"
          "${{ steps.compiler.outputs.linker }}" -dumpmachine
          mkdir -p dist
          cp "${binary}" "dist/synctv"
          cp LICENSE "dist/LICENSE"
          tar -C dist -cJf "synctv-dsm71-${{ matrix.synology_arch }}.tar.xz" synctv LICENSE
          sha256sum "synctv-dsm71-${{ matrix.synology_arch }}.tar.xz" > "synctv-dsm71-${{ matrix.synology_arch }}.tar.xz.sha256"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: synctv-dsm71-${{ matrix.synology_arch }}
          path: |
            synctv-dsm71-${{ matrix.synology_arch }}.tar.xz
            synctv-dsm71-${{ matrix.synology_arch }}.tar.xz.sha256
          if-no-files-found: error
          retention-days: 30
